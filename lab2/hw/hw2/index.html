<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />

    <title>Concurrent FIFO Audio Visualizer</title>

    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        color: #172033;
        background: #f8fafc;
      }

      label {
        display: block;
        margin-bottom: 8px;
      }

      input {
        box-sizing: border-box;
        width: min(100%, 520px);
        min-height: 44px;
        padding: 10px;
      }

      button {
        min-height: 44px;
        margin: 12px 8px 12px 0;
        padding: 10px 16px;
        cursor: pointer;
      }

      #audio-visualizer {
        display: block;
        width: 100%;
        height: 240px;
        background: #0b1220;
        border-radius: 8px;
      }

      #playback-status {
        min-height: 24px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Concurrent FIFO Audio Visualizer</h1>

      <section aria-labelledby="player-heading">
        <h2 id="player-heading">Audio Queue</h2>

        <label for="track-url">Audio URL</label>

        <input
          id="track-url"
          type="url"
          placeholder="Enter a direct audio URL"
          autocomplete="url"
        />

        <button id="play-track" type="button">
          Enqueue and Play
        </button>

        <button id="stop-playback" type="button">
          Stop Playback
        </button>

        <p id="playback-status" role="status" aria-live="polite">
          Ready.
        </p>
      </section>

      <section aria-labelledby="visualizer-heading">
        <h2 id="visualizer-heading">Live Frequency Visualizer</h2>

        <canvas
          id="audio-visualizer"
          width="800"
          height="240"
          role="img"
          aria-label="Live audio frequency spectrum visualizer"
        >
          Audio frequency visualizer.
        </canvas>
      </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
