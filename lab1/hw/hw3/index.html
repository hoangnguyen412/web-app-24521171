<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    >

    <title>Tech Talk 2026 - Event Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1>Tech Talk 2026</h1>
        <p>Join us for a day of talks on the future of technology.</p>
    </header>

    <main id="main-content">
        <section aria-labelledby="countdown-heading">
            <h2 id="countdown-heading">Registration closes in</h2>

            <!-- Countdown contract: duration is configured here, not in JS -->
            <p id="countdown" role="timer" data-duration-days="7">
                <span data-unit="days">--</span> days
                <span data-unit="hours">--</span> hours
                <span data-unit="minutes">--</span> minutes
                <span data-unit="seconds">--</span> seconds
            </p>
        </section>

        <section aria-labelledby="register-heading">
            <h2 id="register-heading">Register Now</h2>

            <!-- method="dialog": outside a <dialog> the browser never navigates,
                 so a native submit can no longer hit the server (no HTTP 405) -->
            <form id="register-form" method="dialog">
                <p>
                    <label for="full-name">Full Name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        required
                        minlength="3"
                        autocomplete="name"
                    >
                </p>

                <p>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </p>

                <p>
                    <label for="organization">Organization (optional)</label>
                    <input
                        type="text"
                        id="organization"
                        name="organization"
                        autocomplete="organization"
                    >
                </p>

                <p>
                    <label for="ticket-type">Ticket Type</label>
                    <select id="ticket-type" name="ticketType">
                        <option value="student">Student</option>
                        <option value="professional">Professional</option>
                    </select>
                </p>

                <p>
                    <label for="special-requests">Special Requests (optional)</label>
                    <textarea
                        id="special-requests"
                        name="specialRequests"
                        rows="4"
                        maxlength="500"
                    ></textarea>
                </p>

                <button type="submit" id="submit-btn" aria-disabled="false">Submit</button>

                <p id="form-status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>HW3 - Web Application Development 2026</p>
    </footer>

    <script src="countdown.js"></script>
    <script src="form.js"></script>
</body>
</html>
